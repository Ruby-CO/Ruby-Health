services:
  - type: web
    name: ruby-health-demo
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      # Claim path: extraction and coding. Revisit against the eval suite once
      # there are real demo encounters to score it on.
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      # Transcript cleanup only -- punctuation repair, not judgment.
      - key: ANTHROPIC_UTILITY_MODEL
        value: claude-haiku-4-5
      # Stedi sandbox submission (837P claims). Test-mode key only reaches
      # Stedi's sandbox network.
      - key: STEDI_API_KEY
        sync: false
