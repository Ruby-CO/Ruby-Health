name: CI

# Runs on every pull request into master, and on master itself. Once branch
# protection requires this check, a red suite blocks the merge -- which is the
# point: master should always be a commit that could be deployed.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # `npm ci` installs exactly what the lockfile pins and fails if
      # package.json and the lockfile disagree -- a drift check for free.
      - name: Install
        working-directory: backend
        run: npm ci

      - name: Test
        working-directory: backend
        run: npm test

      # The eval scorer imports only pure modules from backend/src, so it needs
      # no install step. These tests are what stop the scorecard from silently
      # measuring the wrong thing.
      - name: Eval scorer tests
        run: node --test eval/test/*.test.js

      # Mock mode exercises the runner, fixtures and reporting without calling
      # the model. It scores 100% by construction -- this checks the harness
      # runs, not that the pipeline is accurate.
      - name: Eval harness smoke test
        run: node eval/run.mjs --mock

      - name: Reference code loader tests
        run: node --test reference/test/*.test.js

      # The pipeline is only correct if the server can actually start. A syntax
      # error or bad import in a module no test imports would otherwise ship.
      - name: Server boots
        working-directory: backend
        env:
          PORT: "3999"
        run: |
          node src/server.js &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null' EXIT
          for i in $(seq 1 20); do
            if curl -sf "http://127.0.0.1:3999/api/health" > /dev/null; then
              echo "Server responded on /api/health"
              curl -s "http://127.0.0.1:3999/api/health"
              exit 0
            fi
            sleep 0.5
          done
          echo "Server did not become healthy within 10s"
          exit 1

  # Render's own auto-deploy has never fired for this service: the setting is
  # on, GitHub delivers the push event (this workflow is the proof -- it runs
  # on the same event), and Render does not react. Reconnecting the repo in the
  # dashboard did not change that. So the deploy is driven from here instead.
  #
  # This is the better arrangement anyway: master deploys only after the suite
  # is green, rather than on any push that happens to land.
  deploy:
    name: Deploy to Render
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          # Skips rather than fails when the secret is absent, so adding this
          # workflow cannot turn master red before the secret is in place.
          if [ -z "$HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set -- nothing to deploy to."
            echo "Add it under Settings > Secrets and variables > Actions."
            exit 0
          fi

          STATUS=$(curl -sS -X POST -o /tmp/render-response -w '%{http_code}' "$HOOK_URL")
          cat /tmp/render-response
          echo

          # A deploy hook that quietly 404s looks identical to a working one
          # unless the status code is checked, which is how a broken deploy
          # path stays broken for weeks.
          if [ "$STATUS" -ge 300 ]; then
            echo "Render deploy hook returned HTTP $STATUS"
            exit 1
          fi
          echo "Render deploy triggered."
