name: Schema docs

# Manual only. Nothing in this repo starts it.
#
# It used to run automatically on commits touching the data model, flagging a
# schema change that had not refreshed docs/data/. That is now off by deliberate
# choice: the data-model tooling does not act unless a person asks it to, and
# that rule covers noticing as well as auditing.
#
# What it still does, when you run it: read a diff and say whether the schema
# moved without the generated docs being refreshed. No model is called, nothing
# is regenerated, no file is written. Refreshing the docs is the separate
# "Refresh data model" workflow, which is also manual.
#
# To put it back on automatic, replace the `on:` block with:
#
#   on:
#     pull_request:
#       branches: [master]
#       paths: ["backend/src/repository/**", "backend/src/pipeline/**", "docs/data/**"]
#     push:
#       branches: [master]
#       paths: ["backend/src/repository/**", "backend/src/pipeline/**", "docs/data/**"]
#
# The script still fails the run on a pull_request event, so restoring that
# trigger restores the gating behaviour with no other change.

on:
  workflow_dispatch:
    inputs:
      base:
        description: "Compare against this ref (branch, tag or SHA)"
        required: false
        default: "master"

jobs:
  check:
    name: Are the data-model docs stale?
    runs-on: ubuntu-latest
    steps:
      # Full history: the check diffs a range, and a shallow clone has no base
      # commit to diff against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether the docs still describe the code
        run: |
          BASE="${{ inputs.base }}"
          git rev-parse --verify "origin/$BASE" >/dev/null 2>&1 && BASE="origin/$BASE"
          node .github/scripts/check-schema-docs.mjs "$BASE" HEAD
